name: Official model prices
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/pricing/**', '.github/workflows/pricing-refresh.yml']
permissions:
  contents: read
concurrency:
  group: official-model-prices
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'kgangkgang/blue-lemonade'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pip install -r tools/pricing/requirements.txt
      - name: Test failure isolation and price validation
        run: |
          python -m unittest discover -s tools/pricing -p 'test_*.py'
          node tools/pricing/test-client.mjs
      - name: Load the last published snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/pricing/publish.py prepare --directory "$RUNNER_TEMP/pricing"
      - name: Collect public official sources
        run: python tools/pricing/collect.py --previous "$RUNNER_TEMP/pricing/previous.json" --output "$RUNNER_TEMP/pricing/official-prices.json" --report "$RUNNER_TEMP/pricing/report.json" --sources "$RUNNER_TEMP/pricing/sources"
      - name: Validate the same schema used by the extension
        run: node tools/pricing/validate-feed.mjs "$RUNNER_TEMP/pricing/official-prices.json"
      - name: Publish only verified prices and last-good fallback statuses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/pricing/publish.py publish --directory "$RUNNER_TEMP/pricing"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-check-report
          path: ${{ runner.temp }}/pricing/report.json
          retention-days: 30
      - name: Flag official sources that need attention
        # Fails only for a provider that newly needs a human or has stayed unverified past the grace period;
        # held prices and known reviews stay visible as warnings in the step summary (see tools/pricing/README.md).
        run: python tools/pricing/summarize.py --report "$RUNNER_TEMP/pricing/report.json" --previous "$RUNNER_TEMP/pricing/previous.json" --feed "$RUNNER_TEMP/pricing/official-prices.json"
