        # src/scripts/plain/korean.js + src/ko-ui-text.index.gen.json · ko-ui-text.<조각>.gen.json (9.0.7 · 1.0.0 조각 · 1.3.x JSON: from tools/scripts-src/korean.js minus tools/scripts-src/korean-prune.json, precomputed dictionary checked against the source),
        # src/scripts/plain/{fruit,qingguo,fruit-heart}.js (from tools/scripts-src/fruit-family/, the fruit-family dictionary),
        # src/scripts/plain/fruit-style.js keeps its rule-bucket keys (tools/key-bundled-css.mjs --check; the keys were missing from 8.2.5 and earlier),
        # src/scripts/plain/* module headers (9.0.7: one copy, run in the page without iframes), style.css, src/lazy-panel.gen.css and src/preview.gen.css (9.0.1: settings-preview rules, loaded only when the settings window opens).
        # src/compat-browser.gen.css + src/compat-width.gen.css (1.0.0: rules for non-Chromium engines and widths other than phone 384 / PC 1280, split out of style.css by tools/css-compat.cjs and attached by src/lite.js only when they can match).
        # src/addons/style-addons.css (9.0.9: every addon stylesheet in start order as one sheet — tools/build-addon-css.mjs, run by build-css.cjs; cascade checked by tools/css-cascade-diff.mjs).
        run: |
          node tools/gen-preview-css.js --quiet
          node tools/build-korean-dict.mjs --check
          node tools/build-korean-dict.mjs
          node tools/build-fruit-family.mjs --check
          node tools/key-bundled-css.mjs --check
          node tools/build-fruit-family.mjs
          node tools/build-plain-scripts.mjs
          node tools/build-css.cjs
          (cd tools && npm ci --no-audit --no-fund)
