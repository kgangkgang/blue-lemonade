        # src/compat-browser.gen.css + src/compat-width.gen.css (1.0.0: rules for non-Chromium engines and widths other than phone 384 / PC 1280, split out of style.css by tools/css-compat.cjs and attached by src/lite.js only when they can match).
        # src/addons/style-addons.css (9.0.9: every addon stylesheet in start order as one sheet — tools/build-addon-css.mjs, run by build-css.cjs; cascade checked by tools/css-cascade-diff.mjs).
        run: |
