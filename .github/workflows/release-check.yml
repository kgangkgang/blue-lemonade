name: Release consistency
on:
  push:
    paths: ['src/**', 'css/**', 'index.js', 'style.css', 'manifest.json', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'docs/downloads/**', 'tools/**', '.github/workflows/release-check.yml']
  pull_request:
    paths: ['src/**', 'css/**', 'index.js', 'style.css', 'manifest.json', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'docs/downloads/**', 'tools/**', '.github/workflows/release-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check failure cases and settings preservation
        run: |
          python -m unittest discover -s tools/tests -p 'test_release_gate.py'
          node tools/tests/settings-upgrade.mjs .
          node tools/tests/usage-mode.mjs .
          node tools/tests/translation-cache-loading.mjs .
          node tools/tests/translation-segments.mjs .
          node tools/tests/conversation-assist.mjs .
          node tools/tests/addon-menu-routing.mjs .
          node tools/tests/character-assets.mjs .
          node tools/tests/story-direction.mjs .
          node tools/tests/mix-selection.mjs .
          node tools/tests/capture-motion.mjs .
          node tools/tests/capture-resources.mjs
          node tools/tests/weather-budget.mjs
          node tools/tests/weather-styles.mjs .
          node tools/tests/weather-simple.mjs .
          node tools/tests/weather-amount.mjs .
          node tools/tests/weather-coverage.mjs .
          node tools/tests/glass-motion.mjs .
          node tools/tests/preset-sharing.mjs .
          node tools/tests/appearance-workflow.mjs .
          node tools/tests/optimization-cache.mjs
          node tools/tests/preferences-safety.mjs .
          node tools/tests/appearance-comfort.mjs .
          node tools/tests/gradients-core.mjs .
          node tools/tests/regexlink-engine.mjs .
          node tools/build-integrity.mjs . --check
      - name: Check that generated files match their sources
        # Regenerate in the throwaway checkout, then fail if anything changed:
        # css/43-user-profile.gen.css, css/23-preview.gen.css (check mode fails on new root declarations),
        # src/scripts/plain/*, style.css and src/lazy-panel.gen.css.
        run: |
          node tools/gen-user-profile.cjs
          node tools/gen-preview-css.js --quiet
          node tools/build-plain-scripts.mjs
          node tools/build-css.cjs
          git status --porcelain
          git diff --exit-code --stat
          test -z "$(git status --porcelain)"
      - name: Verify the current downloadable ZIP byte for byte
        run: |
          python -c "import json,subprocess,sys; v=json.load(open('manifest.json'))['version']; subprocess.run([sys.executable,'tools/release_gate.py','--kind','theme','--source','.','--zip',f'docs/downloads/blue-lemonade-{v}.zip'],check=True)"
