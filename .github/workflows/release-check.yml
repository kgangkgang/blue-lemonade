name: Release consistency
on:
  push:
    paths: ['server-plugin/**', 'src/**', 'css/**', 'index.js', 'style.css', 'manifest.json', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'tools/**', '.github/workflows/release-check.yml']
  pull_request:
    paths: ['server-plugin/**', 'src/**', 'css/**', 'index.js', 'style.css', 'manifest.json', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'tools/**', '.github/workflows/release-check.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The website lives on the gh-pages branch; some tests read its files from docs/.
      # The downloadable ZIP is a GitHub Release asset (5.8.0~), checked in the last step.
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: docs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check failure cases and settings preservation
        run: |
          python -m unittest discover -s tools/tests -p 'test_release_gate.py'
          node tools/pricing/test-client.mjs
          node tools/tests/settings-upgrade.mjs .
          node tools/tests/usage-mode.mjs .
          node tools/tests/stream-follow.mjs .
          node tools/tests/tts-integration.mjs .
          node tools/tests/tts-dethump.mjs .
          node tools/tests/tts-pregen-paid.mjs .
          node tools/tests/tts-balance.mjs .
          node tools/tests/tts-prefer.mjs .
          node tools/tests/tts-models.mjs .
          node tools/tests/tts-extras.mjs .
          node tools/tests/tts-onboarding.mjs .
          node tools/tests/tts-listen.mjs .
          node tools/tests/tts-scene.mjs .
          node tools/tests/tts-sfx-timing.mjs .
          node tools/tests/tts-sfx-credits.mjs .
          node tools/tests/tts-sfx-level.mjs .
          node tools/tests/chat-like-alias.mjs .
          node tools/tests/zipinstall-remove.mjs .
          node tools/tests/word-replace-marks.mjs .
          node tools/tests/translator-glossary.mjs .
          node tools/tests/translator-speech.mjs .
          node tools/tests/bookmark-excerpts.mjs .
          node tools/tests/main-chat-rules.mjs .
          node tools/tests/natural-slash.mjs .
          node tools/tests/live-models.mjs .
          node tools/tests/translator-models.mjs .
          node tools/tests/rewrite-models.mjs .
          node tools/tests/prompt-models.mjs .
          node tools/tests/modelswitch-models.mjs .
          node tools/tests/update-check.mjs .
          node tools/tests/translation-cache-loading.mjs .
          node tools/tests/translation-segments.mjs .
          node tools/tests/translation-display.mjs .
          node tools/tests/conversation-assist.mjs .
          node tools/tests/addon-menu-routing.mjs .
          node tools/tests/name-row-align.mjs .
          node tools/tests/character-assets.mjs .
          node tools/tests/story-direction.mjs .
          node tools/tests/mix-selection.mjs .
          node tools/tests/capture-motion.mjs .
          node tools/tests/capture-filter.mjs .
          node tools/tests/capture-editor.mjs .
          node tools/tests/capture-resources.mjs
          node tools/tests/weather-budget.mjs
          node tools/tests/weather-styles.mjs .
          node tools/tests/weather-simple.mjs .
          node tools/tests/weather-amount.mjs .
          node tools/tests/weather-coverage.mjs .
          node tools/tests/weather-retired.mjs .
          node tools/tests/translator-archive-bridge.mjs .
          node tools/tests/modelswitch-detect.mjs .
          node tools/tests/model-register-move.mjs .
          node tools/tests/preset-sharing.mjs .
          node tools/tests/appearance-workflow.mjs .
          node tools/tests/markdown-settings.mjs .
          node tools/tests/chat-graph.mjs .
          node tools/tests/audit-regressions.mjs .
          node tools/tests/optimization-cache.mjs
          node tools/tests/preferences-safety.mjs .
          node tools/tests/appearance-comfort.mjs .
          node tools/tests/gradients-core.mjs .
          node tools/tests/regexlink-engine.mjs .
          node tools/build-integrity.mjs . --check
      - name: Check that generated files match their sources
        # Regenerate in the throwaway checkout, then fail if anything changed:
        # css/43-user-profile.gen.css, css/23-preview.gen.css (check mode fails on new root declarations),
        # src/scripts/plain/*, style.css and src/lazy-panel.gen.css.
        run: |
          node tools/gen-user-profile.cjs
          node tools/gen-preview-css.js --quiet
          node tools/build-plain-scripts.mjs
          node tools/build-css.cjs
          git status --porcelain
          git diff --exit-code --stat
          test -z "$(git status --porcelain)"
      - name: Build the release ZIP from this tree
        run: |
          v=$(python -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")
          out="$RUNNER_TEMP/bl-built/blue-lemonade-$v.zip"
          python tools/release_gate.py --kind theme --source . --build "$out" > "$RUNNER_TEMP/bl-gate.json"
          sha256sum "$out"
          echo "BL_VERSION=$v" >> "$GITHUB_ENV"
          echo "BL_ZIP=$out" >> "$GITHUB_ENV"
      - name: Verify the release asset against this tree
        # release (published) and manual runs: the asset vX.Y.Z/blue-lemonade-X.Y.Z.zip for the manifest version must exist
        # and be byte for byte the ZIP built above. push / pull_request: a release commit is pushed before its release exists,
        # so a missing asset is only a notice; once the release exists the asset must match (a theme change without a new
        # version fails, as the gh-pages ZIP check did).
        run: |
          python - <<'PY'
          import hashlib, io, os, sys, time, urllib.error, urllib.request, zipfile
          sys.path.insert(0, 'tools')
          import release_gate as gate
          version, built = os.environ['BL_VERSION'], os.environ['BL_ZIP']
          event, tag = os.environ.get('GITHUB_EVENT_NAME', ''), 'v' + version
          strict = event in ('release', 'workflow_dispatch')
          if event == 'release' and os.environ.get('GITHUB_REF_NAME') != tag:
              sys.exit(f"::error::Release tag {os.environ.get('GITHUB_REF_NAME')} does not match the manifest version (expected {tag})")
          name = f'blue-lemonade-{version}.zip'
          url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{name}"
          tries = 10 if event == 'release' else 1   # 'published' can fire while the asset is still uploading
          for attempt in range(tries):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'blue-lemonade-ci'}), timeout=120) as r:
                      asset = r.read()
                  break
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
                  if attempt + 1 < tries:
                      time.sleep(30)
          else:
              if strict:
                  sys.exit(f'::error::No release asset at {url}')
              print(f'::notice::No release asset for {version} yet; only the ZIP built from this tree was checked.')
              sys.exit(0)
          path = os.path.join(os.environ['RUNNER_TEMP'], 'bl-asset', name)
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, 'wb') as f:
              f.write(asset)
          try:
              packaged = gate.read_zip(path, 'blue-lemonade')
              gate.validate(packaged, 'theme')
              gate.compare(gate.inventory('.', 'theme'), packaged, 'Release asset ' + name)
          except gate.GateError as e:
              sys.exit(f'::error::{e}')
          with open(built, 'rb') as f:
              mine = f.read()
          a, b = hashlib.sha256(asset).hexdigest(), hashlib.sha256(mine).hexdigest()
          print(f'asset {len(asset)} bytes sha256 {a}  {url}')
          print(f'built {len(mine)} bytes sha256 {b}')
          if a != b:
              def meta(data):
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      return z.comment, [(i.filename, i.date_time, i.external_attr, i.compress_type, i.CRC, i.file_size, i.extra) for i in z.infolist()]
              # 5.8.0: GitHub's runner zlib compresses differently from the release machine, so the bytes can differ while
              # every file, date and CRC is identical. The contents were already compared with this tree above (gate.compare).
              if meta(asset) != meta(mine):
                  sys.exit('::error::The release asset differs from the ZIP built from this tree (file list, dates, attributes or CRCs)')
              print('::notice::Same files, dates and CRCs as the ZIP built here; only the deflate streams differ (runner zlib).')
          print('PASS: the release asset matches this tree file by file')
          PY
