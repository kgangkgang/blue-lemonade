name: Release consistency
on:
  push:
    paths: ['src/**', 'index.js', 'style.css', 'manifest.json', 'README.md', 'docs/downloads/**', 'tools/**', '.github/workflows/release-check.yml']
  pull_request:
    paths: ['src/**', 'index.js', 'style.css', 'manifest.json', 'README.md', 'docs/downloads/**', 'tools/**', '.github/workflows/release-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check failure cases and settings preservation
        run: |
          python -m unittest discover -s tools/tests -p 'test_release_gate.py'
          node tools/tests/settings-upgrade.mjs .
          node tools/tests/capture-motion.mjs .
          node tools/tests/capture-resources.mjs
          node tools/tests/weather-budget.mjs
          node tools/tests/weather-styles.mjs .
      - name: Verify the current downloadable ZIP byte for byte
        run: |
          python -c "import json,subprocess,sys; v=json.load(open('manifest.json'))['version']; subprocess.run([sys.executable,'tools/release_gate.py','--kind','theme','--source','.','--zip',f'docs/downloads/blue-lemonade-{v}.zip'],check=True)"
