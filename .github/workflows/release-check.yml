name: Release consistency
on:
  push:
    paths: ['server-plugin/**', 'src/**', 'css/**', 'index.js', 'style.css', 'style-ext.css', 'manifest.json', 'README.md', 'CHANGELOG.md', 'DEVELOPERS.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'tools/**', '.github/workflows/release-check.yml']
  pull_request:
    paths: ['server-plugin/**', 'src/**', 'css/**', 'index.js', 'style.css', 'style-ext.css', 'manifest.json', 'README.md', 'CHANGELOG.md', 'DEVELOPERS.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'tools/**', '.github/workflows/release-check.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 8.3.0: 소개 사이트(gh-pages → docs/)는 내렸다. docs/ 를 읽던 시험(appearance-workflow · preferences-safety)도 함께 뺐고 faq.mjs 는 docs/ 가 없으면 건너뛴다.
      # The downloadable ZIP is a GitHub Release asset (5.8.0~), checked in the last step.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'   # 1.1.9: 시험 도구가 module.register 로더 훅을 써요 — 노드 22 는 훅이 따로 도는 스레드라 동적 import 를 기다리느라 chat-switch-leak 이 설정당 240초를 넘었어요(로컬 개발 · 사전 점검은 노드 24)
      - name: Check failure cases and settings preservation
        run: |
          node --test tools/tests/pull-to-refresh.mjs
          node tools/tests/module-syntax-links.mjs .
          node tools/tests/module-undeclared.mjs .
          python -m unittest discover -s tools/tests -p 'test_release_gate.py'
          node tools/tests/version-series.mjs .
          # 1.0.0 전수조사 고침 (필수 14 · 먼저 3 · 작은 권장)
          node tools/tests/bookmarks-per-page-words.mjs .
          node tools/tests/direction-addon-off.mjs .
          node tools/tests/light-threshold-words.mjs .
          node tools/tests/log-copy-fav-limit.mjs .
          node tools/tests/char-tone.mjs .
          node tools/tests/char-tone-ladder.mjs .
          node tools/tests/log-copy-tone.mjs .
          node tools/tests/log-copy-audit-113.mjs .
          node tools/tests/log-copy-connect-113.mjs .
          node tools/tests/log-copy-connect-sheet-113.mjs .
          node tools/tests/log-copy-simple-head.mjs .
          node tools/tests/log-copy-simple.mjs .
          node tools/tests/log-copy-simple-em.mjs .
          node tools/tests/log-copy-simple-mart.mjs .
          node tools/tests/log-copy-simple-frames.mjs .
          node tools/tests/log-copy-simple-old71.mjs .
          node tools/mart/simple-frames.mjs --check
          node tools/tests/log-copy-simple-pack.mjs .
          # 1.2.1 명조 본문 심플 틀의 굵게가 가짜 굵게로 뭉개지던 것(굵게 = 고딕 700 · 마트 고침 ce06d4f8b 와 같은 규칙)
          node tools/tests/log-copy-simple-bold.mjs .
          node tools/tests/log-copy-basic.mjs .
          # 1.1.5 「레몬 바로가기」를 끄면 기본 글꾸 18틀도 레몬이 그림째 사라지는지(켠 그림은 그대로)
          node tools/tests/log-copy-lemon-off.mjs .
          node tools/mart/basic-frames.mjs --check
          # 1.2.1 깡통이 <details> 안 내용을 class 없는 div 로 감싸도 펼친 글이 보이는지(빈 줄만 숨김 · 마트 고침 ce06d4f8b 와 같은 선택자)
          node tools/tests/log-copy-kk-details-wrap.mjs .
