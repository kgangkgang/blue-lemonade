name: Release consistency
on:
  push:
    paths: ['server-plugin/**', 'src/**', 'css/**', 'index.js', 'style.css', 'style-ext.css', 'manifest.json', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'tools/**', '.github/workflows/release-check.yml']
  pull_request:
    paths: ['server-plugin/**', 'src/**', 'css/**', 'index.js', 'style.css', 'style-ext.css', 'manifest.json', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'tools/**', '.github/workflows/release-check.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The website lives on the gh-pages branch; some tests read its files from docs/.
      # The downloadable ZIP is a GitHub Release asset (5.8.0~), checked in the last step.
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: docs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check failure cases and settings preservation
        run: |
          node --test tools/tests/pull-to-refresh.mjs
          python -m unittest discover -s tools/tests -p 'test_release_gate.py'
          node tools/pricing/test-client.mjs
