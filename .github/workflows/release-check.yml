      - name: Check that generated files match their sources
        # Regenerate in the throwaway checkout, then fail if anything changed:
        # css/43-user-profile.gen.css, css/23-preview.gen.css (check mode fails on new root declarations),
        # src/scripts/bundled/korean.js (from tools/scripts-src/korean.js, precomputed dictionary checked against the source),
        # src/scripts/bundled/{fruit,qingguo,fruit-heart}.js (from tools/scripts-src/fruit-family/, the fruit-family dictionary),
        # src/scripts/plain/*, style.css, src/lazy-panel.gen.css and src/preview-park.gen.css.
        run: |
          node tools/gen-user-profile.cjs
          node tools/gen-preview-css.js --quiet
          node tools/build-korean-dict.mjs --check
          node tools/build-korean-dict.mjs
          node tools/build-fruit-family.mjs --check
          node tools/build-fruit-family.mjs
          node tools/build-plain-scripts.mjs
          node tools/build-css.cjs
          git status --porcelain
          git diff --exit-code --stat
          test -z "$(git status --porcelain)"
      - name: Build the release ZIP from this tree
        run: |
          v=$(python -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")
          out="$RUNNER_TEMP/bl-built/blue-lemonade-$v.zip"
          python tools/release_gate.py --kind theme --source . --build "$out" > "$RUNNER_TEMP/bl-gate.json"
          sha256sum "$out"
          echo "BL_VERSION=$v" >> "$GITHUB_ENV"
          echo "BL_ZIP=$out" >> "$GITHUB_ENV"
      - name: Verify the release asset against this tree
        # release (published) and manual runs: the asset vX.Y.Z/blue-lemonade-X.Y.Z.zip for the manifest version must exist
        # and be byte for byte the ZIP built above. push / pull_request: a release commit is pushed before its release exists,
        # so a missing asset is only a notice; once the release exists the asset must match (a theme change without a new
        # version fails, as the gh-pages ZIP check did).
        run: |
          python - <<'PY'
          import hashlib, io, os, sys, time, urllib.error, urllib.request, zipfile
          sys.path.insert(0, 'tools')
          import release_gate as gate
          version, built = os.environ['BL_VERSION'], os.environ['BL_ZIP']
          event, tag = os.environ.get('GITHUB_EVENT_NAME', ''), 'v' + version
          strict = event in ('release', 'workflow_dispatch')
          if event == 'release' and os.environ.get('GITHUB_REF_NAME') != tag:
              sys.exit(f"::error::Release tag {os.environ.get('GITHUB_REF_NAME')} does not match the manifest version (expected {tag})")
          name = f'blue-lemonade-{version}.zip'
          url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{name}"
          tries = 10 if event == 'release' else 1   # 'published' can fire while the asset is still uploading
          for attempt in range(tries):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'blue-lemonade-ci'}), timeout=120) as r:
                      asset = r.read()
                  break
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
                  if attempt + 1 < tries:
                      time.sleep(30)
          else:
              if strict:
                  sys.exit(f'::error::No release asset at {url}')
              print(f'::notice::No release asset for {version} yet; only the ZIP built from this tree was checked.')
              sys.exit(0)
          path = os.path.join(os.environ['RUNNER_TEMP'], 'bl-asset', name)
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, 'wb') as f:
              f.write(asset)
          try:
              packaged = gate.read_zip(path, 'blue-lemonade')
              gate.validate(packaged, 'theme')
              gate.compare(gate.inventory('.', 'theme'), packaged, 'Release asset ' + name)
          except gate.GateError as e:
              sys.exit(f'::error::{e}')
          with open(built, 'rb') as f:
              mine = f.read()
          a, b = hashlib.sha256(asset).hexdigest(), hashlib.sha256(mine).hexdigest()
          print(f'asset {len(asset)} bytes sha256 {a}  {url}')
          print(f'built {len(mine)} bytes sha256 {b}')
          if a != b:
              def meta(data):
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      return z.comment, [(i.filename, i.date_time, i.external_attr, i.compress_type, i.CRC, i.file_size, i.extra) for i in z.infolist()]
              # 5.8.0: GitHub's runner zlib compresses differently from the release machine, so the bytes can differ while
              # every file, date and CRC is identical. The contents were already compared with this tree above (gate.compare).
              if meta(asset) != meta(mine):
                  sys.exit('::error::The release asset differs from the ZIP built from this tree (file list, dates, attributes or CRCs)')
              print('::notice::Same files, dates and CRCs as the ZIP built here; only the deflate streams differ (runner zlib).')
          print('PASS: the release asset matches this tree file by file')
          PY
