<div class="gk-hd"><a class="gk-lm" href="https://kkangtong.xyz/posts/157369" target="_blank" rel="noopener noreferrer" title="블루레몬에이드" aria-label="블루레몬에이드"><span class="gk-lmi"></span></a></div>
<details class="gk-bd"><summary aria-label="블라인드 걷기"><span class="gk-tt">비 그친 뒤, 옥상에서</span><span class="gk-ul gk-uA"></span><span class="gk-bl"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span><span class="gk-br"></span><span class="gk-cw"><span class="gk-cd" style="animation:gk-cd 5.2s ease-in-out 0s infinite alternate"><span class="gk-cl"></span><span class="gk-cb"></span></span></span></summary>
<div class="gk-lg">
<p class="gk-nr">옥상 문을 밀자 젖은 바닥 냄새가 먼저 올라왔다. 이름은 난간에 기대어, 아직 다 마르지 않은 하늘을 한참 올려다보고 있었다.</p>
<p class="gk-nm gk-nA">이름</p>
<p class="gk-dl" style="animation:gk-dl .35s ease-out 0.2s both"><span class="gk-d gk-dA">「……여기 있을 줄 알았어. 전화는 왜 안 받아?」</span></p>
<div class="gk-sd"><span class="gk-sn gk-sA">이름</span><audio controls preload="none" style="display:block;flex:1 1 auto;min-width:0;width:auto;max-width:100%;height:26px;block-size:26px;margin:0!important;color-scheme:dark"></audio></div>
<p class="gk-nr">친구는 대답 대신 주머니에서 캔 커피 두 개를 꺼냈다. 하나는 미지근했고, 하나는 아직 따뜻했다.</p>
<p class="gk-nm gk-nB">친구</p>
<p class="gk-dl" style="animation:gk-dl .35s ease-out 0.45s both"><span class="gk-d gk-dB">「받으면 네가 안 올라올 것 같아서. 따뜻한 쪽은 네 거야.」</span></p>
