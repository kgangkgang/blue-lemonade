<div class="gk-top"><div class="gk-tc"><a class="gk-lm" href="https://kkangtong.xyz/posts/157369" target="_blank" rel="noopener noreferrer" title="블루레몬에이드" aria-label="블루레몬에이드"><span class="gk-lmi"></span></a><div class="gk-tt">비 그친 뒤, 옥상에서</div><span class="gk-ul gk-uA"></span></div><details class="gk-kx"><summary class="gk-mt" aria-label="메트로놈 네 박"><span class="gk-cp"></span><span class="gk-by"></span><span class="gk-wn"><span class="gk-pd"><span class="gk-rd"></span><span class="gk-wt"></span><span class="gk-pv"></span></span></span><span class="gk-bs"></span></summary></details></div>
<div class="gk-lg">
<p class="gk-nr gk-b1">옥상 문을 밀자 젖은 바닥 냄새가 먼저 올라왔다. 이름은 난간에 기대어, 아직 다 마르지 않은 하늘을 한참 올려다보고 있었다.</p>
<p class="gk-nm gk-nA gk-b2">이름</p>
<p class="gk-dl gk-b2"><span class="gk-d gk-dA">「……여기 있을 줄 알았어. 전화는 왜 안 받아?」</span></p>
<p class="gk-nr gk-b3">친구는 대답 대신 주머니에서 캔 커피 두 개를 꺼냈다. 하나는 미지근했고, 하나는 아직 따뜻했다.</p>
<p class="gk-nm gk-nB gk-b4">친구</p>
<p class="gk-dl gk-b4"><span class="gk-d gk-dB">「받으면 네가 안 올라올 것 같아서. 따뜻한 쪽은 네 거야.」</span></p>
