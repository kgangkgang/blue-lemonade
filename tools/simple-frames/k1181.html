<span class="gk-ul gk-uA"></span>
</div>
<details class="gk-kx"><summary class="gk-pb" aria-label="종 치기"><span class="gk-gw gk-rg"><span class="gk-ly gk-r1"></span><span class="gk-ly gk-r2"></span></span><span class="gk-ly gk-bm"></span><span class="gk-gw gk-bl"><span class="gk-ly gk-lp"></span><span class="gk-ly gk-bb"></span><span class="gk-ly gk-b1"></span><span class="gk-ly gk-dj"></span></span><span class="gk-gw gk-dm"><span class="gk-ly gk-rp"></span><span class="gk-ly gk-wd"></span><span class="gk-ly gk-we"></span></span></summary></details>

<div class="gk-lg">
<p class="gk-nr">옥상 문을 밀자 젖은 바닥 냄새가 먼저 올라왔다. 이름은 난간에 기대어, 아직 다 마르지 않은 하늘을 한참 올려다보고 있었다.</p>
<p class="gk-nm gk-nA">이름</p>
<p class="gk-dl gk-q1"><span class="gk-d gk-dA">「……여기 있을 줄 알았어. 전화는 왜 안 받아?」</span></p>
<div class="gk-sd"><span class="gk-sn gk-sA">이름</span><audio controls preload="none" style="display:block;flex:1 1 auto;min-width:0;width:auto;max-width:100%;height:26px;block-size:26px;margin:0!important;color-scheme:light"></audio></div>
<p class="gk-nr">친구는 대답 대신 주머니에서 캔 커피 두 개를 꺼냈다. 하나는 미지근했고, 하나는 아직 따뜻했다.</p>
<p class="gk-nm gk-nB">친구</p>
<p class="gk-dl gk-q2"><span class="gk-d gk-dB">「받으면 네가 안 올라올 것 같아서. 따뜻한 쪽은 네 거야.」</span></p>
