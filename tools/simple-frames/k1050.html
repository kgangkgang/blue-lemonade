<div class="gk-top"><div class="gk-tc"><a class="gk-lm" href="https://kkangtong.xyz/posts/157369" target="_blank" rel="noopener noreferrer" title="블루레몬에이드" aria-label="블루레몬에이드"><span class="gk-lmi"></span></a><div class="gk-tt">비 그친 뒤, 옥상에서</div><span class="gk-ul gk-uB"></span></div><details class="gk-kx"><summary class="gk-pc" aria-label="엽서 뒤집기"><span class="gk-cd"><span class="gk-ad"><span class="gk-m1"></span><span class="gk-m2"></span><span class="gk-m3"></span><span class="gk-m4"></span><span class="gk-dv"></span><span class="gk-st"><span class="gk-si"><span class="gk-so"></span></span></span><span class="gk-w1"></span><span class="gk-w2"></span><span class="gk-w3"></span><span class="gk-pm"></span><span class="gk-a1"></span><span class="gk-a2"></span><span class="gk-a3"></span></span><span class="gk-pi"><span class="gk-pv"><span class="gk-su"></span><span class="gk-mb"></span><span class="gk-mf"></span></span></span></span></summary></details></div>
<div class="gk-sl"><div class="gk-lw"><div class="gk-lg">
<p class="gk-nr">옥상 문을 밀자 젖은 바닥 냄새가 먼저 올라왔다. 이름은 난간에 기대어, 아직 다 마르지 않은 하늘을 한참 올려다보고 있었다.</p>
<p class="gk-nm gk-nB">이름</p>
<p class="gk-dl"><span class="gk-d gk-dB">「……여기 있을 줄 알았어. 전화는 왜 안 받아?」</span></p>
<div class="gk-sd"><span class="gk-sn gk-sB">이름</span><audio controls preload="none" style="display:block;flex:1 1 auto;min-width:0;width:auto;max-width:100%;height:26px;block-size:26px;margin:0!important;color-scheme:light"></audio></div>
<p class="gk-nr">친구는 대답 대신 주머니에서 캔 커피 두 개를 꺼냈다. 하나는 미지근했고, 하나는 아직 따뜻했다.</p>
<p class="gk-nm gk-nA">친구</p>
<p class="gk-dl"><span class="gk-d gk-dA">「받으면 네가 안 올라올 것 같아서. 따뜻한 쪽은 네 거야.」</span></p>
