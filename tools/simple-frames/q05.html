<div class="gk-top"><div class="gk-tc"><a class="gk-lm" href="https://kkangtong.xyz/posts/157369" target="_blank" rel="noopener noreferrer" title="블루레몬에이드" aria-label="블루레몬에이드"><span class="gk-lmi"></span></a><div class="gk-tt">비 그친 뒤, 옥상에서</div><span class="gk-ul gk-uB"></span></div><details class="gk-kx"><summary class="gk-mb" aria-label="말풍선 보내기"><span class="gk-lw gk-sa"><span class="gk-ly gk-m-tb gk-cb"></span><span class="gk-ly gk-m-d0 gk-dt" style="animation:gk-q-ty 1.3s ease-in-out 0.00s infinite"></span><span class="gk-ly gk-m-d1 gk-dt" style="animation:gk-q-ty 1.3s ease-in-out 0.16s infinite"></span><span class="gk-ly gk-m-d2 gk-dt" style="animation:gk-q-ty 1.3s ease-in-out 0.32s infinite"></span></span><span class="gk-lw gk-sb-o"><span class="gk-ly gk-m-sb gk-c5"></span><span class="gk-ly gk-m-sl gk-c1"></span><span class="gk-ly gk-m-s1 gk-c5"></span></span></summary></details></div>
<div class="gk-lg">
<p class="gk-nr">옥상 문을 밀자 젖은 바닥 냄새가 먼저 올라왔다. 이름은 난간에 기대어, 아직 다 마르지 않은 하늘을 한참 올려다보고 있었다.</p>
<p class="gk-nm gk-nB">이름</p>
<p class="gk-dl"><span class="gk-d gk-dB">「……여기 있을 줄 알았어. 전화는 왜 안 받아?」</span></p>
<div class="gk-sd"><span class="gk-sn gk-sB">이름</span><audio controls preload="none" style="display:block;flex:1 1 auto;min-width:0;width:auto;max-width:100%;height:26px;block-size:26px;margin:0!important;color-scheme:light"></audio></div>
<p class="gk-nr">친구는 대답 대신 주머니에서 캔 커피 두 개를 꺼냈다. 하나는 미지근했고, 하나는 아직 따뜻했다.</p>
<p class="gk-nm gk-nA">친구</p>
<p class="gk-dl"><span class="gk-d gk-dA">「받으면 네가 안 올라올 것 같아서. 따뜻한 쪽은 네 거야.」</span></p>
