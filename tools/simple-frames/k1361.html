<div class="gk-tt">비 그친 뒤, 옥상에서</div>

<details class="gk-kx"><summary class="gk-pb" aria-label="글 쓰기"><span class="gk-rc gk-ld"></span><span class="gk-ly gk-ba"></span><span class="gk-ly gk-nt"></span><span class="gk-rc gk-l1"></span><span class="gk-rc gk-l2"></span><span class="gk-rc gk-l3"></span><span class="gk-lw gk-cw"><span class="gk-rc gk-ct"></span></span></summary></details>

<div class="gk-lg">
<p class="gk-nr">옥상 문을 밀자 젖은 바닥 냄새가 먼저 올라왔다. 이름은 난간에 기대어, 아직 다 마르지 않은 하늘을 한참 올려다보고 있었다.</p>
<div class="gk-qq gk-q1 gk-wA">
<p class="gk-nm gk-nA">이름</p>
<p class="gk-dl"><span class="gk-d gk-dA">「……여기 있을 줄 알았어. 전화는 왜 안 받아?」</span></p>
</div>
<p class="gk-nr">친구는 대답 대신 주머니에서 캔 커피 두 개를 꺼냈다. 하나는 미지근했고, 하나는 아직 따뜻했다.</p>
