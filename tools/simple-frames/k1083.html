<details class="gk-kx"><summary class="gk-pb" aria-label="폭죽 끈 당겨 터뜨리기"><span class="gk-gw gk-pp"><span class="gk-gw gk-pl"><span class="gk-rc gk-sc"></span><span class="gk-rc gk-kn"></span></span><span class="gk-ly gk-cn"></span><span class="gk-ly gk-s1"></span><span class="gk-ly gk-mo"></span></span><span class="gk-gw gk-k1"><span class="gk-ly gk-a1"></span><span class="gk-ly gk-a2"></span></span><span class="gk-gw gk-k2"><span class="gk-ly gk-b1"></span><span class="gk-ly gk-b2"></span><span class="gk-ly gk-b3"></span></span><span class="gk-gw gk-k3"><span class="gk-ly gk-c1"></span><span class="gk-ly gk-c2"></span></span></summary></details>

<div class="gk-lg">
<p class="gk-nr">옥상 문을 밀자 젖은 바닥 냄새가 먼저 올라왔다. 이름은 난간에 기대어, 아직 다 마르지 않은 하늘을 한참 올려다보고 있었다.</p>
<p class="gk-nm gk-nB">이름</p>
<p class="gk-dl gk-q1"><span class="gk-d gk-dB">「……여기 있을 줄 알았어. 전화는 왜 안 받아?」</span></p>
<p class="gk-nr">친구는 대답 대신 주머니에서 캔 커피 두 개를 꺼냈다. 하나는 미지근했고, 하나는 아직 따뜻했다.</p>
<p class="gk-nm gk-nA">친구</p>
<p class="gk-dl gk-q2"><span class="gk-d gk-dA">「받으면 네가 안 올라올 것 같아서. 따뜻한 쪽은 네 거야.」</span></p>
