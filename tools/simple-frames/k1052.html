<div class="gk-tt">비 그친 뒤, 옥상에서</div>
<span class="gk-ul gk-uA"></span>
</div>
<details class="gk-kx"><summary class="gk-pb" aria-label="달 채우기"><span class="gk-gw gk-mw"><span class="gk-rc gk-ml"></span><span class="gk-gw gk-mc"><span class="gk-ly gk-mk"></span></span></span><span class="gk-ly gk-s1"></span><span class="gk-gw gk-g2"><span class="gk-ly gk-s2"></span></span><span class="gk-gw gk-g3"><span class="gk-ly gk-s3"></span></span></summary></details>

<div class="gk-lg">
<p class="gk-nr">옥상 문을 밀자 젖은 바닥 냄새가 먼저 올라왔다. 이름은 난간에 기대어, 아직 다 마르지 않은 하늘을 한참 올려다보고 있었다.</p>
<p class="gk-nm gk-nA">이름</p>
<p class="gk-dl"><span class="gk-d gk-dA">「……여기 있을 줄 알았어. 전화는 왜 안 받아?」</span></p>
<p class="gk-nr">친구는 대답 대신 주머니에서 캔 커피 두 개를 꺼냈다. 하나는 미지근했고, 하나는 아직 따뜻했다.</p>
<p class="gk-nm gk-nB">친구</p>
<p class="gk-dl"><span class="gk-d gk-dB">「받으면 네가 안 올라올 것 같아서. 따뜻한 쪽은 네 거야.」</span></p>
