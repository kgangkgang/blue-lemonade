<div class="gk-hd"><a class="gk-lm" href="https://kkangtong.xyz/posts/157369" target="_blank" rel="noopener noreferrer" title="블루레몬에이드" aria-label="블루레몬에이드"><span class="gk-lmi"></span></a></div>
<div class="gk-tt">비 그친 뒤, 옥상에서</div><span class="gk-ul gk-uM"></span>
<div class="gk-lg">
<p class="gk-nr">옥상 문을 밀자 젖은 바닥 냄새가 먼저 올라왔다. 이름은 난간에 기대어, 아직 다 마르지 않은 하늘을 한참 올려다보고 있었다.</p>
<p class="gk-nm gk-nM">이름</p>
<p class="gk-dl" style="animation:gk-dl .35s ease-out 0.2s both"><span class="gk-d gk-dM">「……여기 있을 줄 알았어. 전화는 왜 안 받아?」</span></p>
<p class="gk-nr">친구는 대답 대신 주머니에서 캔 커피 두 개를 꺼냈다. 하나는 미지근했고, 하나는 아직 따뜻했다.</p>
<p class="gk-nm gk-nA">친구</p>
<p class="gk-dl" style="animation:gk-dl .35s ease-out 0.45s both"><span class="gk-d gk-dA">「받으면 네가 안 올라올 것 같아서. 따뜻한 쪽은 네 거야.」</span></p>
</div>
<div class="gk-ft"><span class="gk-hl">……사실은, 올라와 주길 기다리고 있었다.</span><details class="gk-kx"><summary class="gk-cup" aria-label="차 우리기"><span class="gk-ly gk-m-st0 gk-c3 gk-stm" style="animation:gk-sm 3.6s ease-in-out 0.0s infinite"></span><span class="gk-ly gk-m-st1 gk-c3 gk-stm" style="animation:gk-sm 3.6s ease-in-out 1.2s infinite"></span><span class="gk-ly gk-m-st2 gk-c3 gk-stm" style="animation:gk-sm 3.6s ease-in-out 2.4s infinite"></span><span class="gk-ly gk-b-cup"></span><span class="gk-ly gk-m-wat gk-c1"></span><span class="gk-ly gk-m-liq gk-c5 gk-tea"></span><span class="gk-ly gk-m-bag gk-c7"></span><span class="gk-ly gk-m-hl gk-c3 gk-tea2"></span><span class="gk-ly gk-b-str"></span><span class="gk-ly gk-sw" style="animation:gk-tb 4.8s ease-in-out 0s infinite alternate"><span class="gk-ly gk-b-st2"></span><span class="gk-ly gk-m-tgf gk-c1"></span><span class="gk-ly gk-m-tgs gk-c7"></span></span></summary></details></div>
